server {
  listen 80;
  server_name mywavetour.ru www.mywavetour.ru admin.mywavetour.ru api.mywavetour.ru;

  # HTTP-01 Let's Encrypt (certbot --webroot -w infra/certbot-webroot на хосте)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name mywavetour.ru www.mywavetour.ru;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # Встроенный DNS Docker; переменная в proxy_pass откладывает резолв до запроса — иначе при старте nginx
  # иногда раньше появляется записи web/api в DNS → emerg "host not found in upstream".
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Прокси картинок в Next.js (app/api/media). Иначе location /api/ шлёт всё на backend → 404 на /api/media?url=...
  location ^~ /api/media {
    set $mw_web web:3000;
    proxy_pass http://$mw_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Короткий health без префикса /api: иначе location / уходит в Next.js → 404 (API живёт на api:3001)
  location = /health {
    set $mw_api api:3001;
    proxy_pass http://$mw_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    set $mw_web web:3000;
    proxy_pass http://$mw_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    set $mw_api api:3001;
    proxy_pass http://$mw_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.mywavetour.ru;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $mw_admin admin:3002;
    proxy_pass http://$mw_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.mywavetour.ru;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $mw_api api:3001;
    proxy_pass http://$mw_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
