name: Deploy Camp API

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Optional git ref/SHA to package; empty uses workflow ref"
        type: string
        required: false
        default: ""
      deploy_to_vps:
        description: "Run SSH deploy after artifact upload"
        type: boolean
        default: false
      rotate_camp_token:
        description: "Rotate CAMP_API_TOKEN on VPS without printing it"
        type: boolean
        default: true
      build_mode:
        description: "incremental uses Docker cache; full uses --no-cache for api"
        type: choice
        default: incremental
        options:
          - incremental
          - full
      operation:
        description: "deploy rebuilds API; restart_proxy_only only refreshes reverse-proxy and runs Camp API smoke"
        type: choice
        default: deploy
        options:
          - deploy
          - restart_proxy_only

concurrency:
  group: deploy-camp-api
  cancel-in-progress: true

jobs:
  deploy-camp-api:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Resolve release source SHA
        id: release
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo ">>> release source sha: ${SOURCE_SHA}"

      - name: Validate local Camp API files
        run: |
          set -euo pipefail
          test -f services/api/src/modules/camp-feed/routes.ts
          test -f services/api/src/modules/camp-feed/mapper.ts
          test -f services/api/src/modules/camp-feed/auth.ts
          grep -R 'router.get("/api/v1/camps"' -n services/api/src/modules/camp-feed/routes.ts
          grep -R 'router.get("/api/v1/camps/:id"' -n services/api/src/modules/camp-feed/routes.ts
          grep -R 'router.get("/camps-feed.json"' -n services/api/src/modules/camp-feed/routes.ts
          grep -R 'campFeedRoutes' -n services/api/src/index.ts
          grep -R 'CAMP_API_TOKEN' -n packages/config/src/env.ts
          grep -R 'next_offset' -n services/api/src/modules/camp-feed/routes.ts

      - name: Create selected-files release artifact
        env:
          RELEASE_SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/camp-api-delivery
          STAGE="/tmp/camp-api-delivery/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          copy_file() {
            local path="$1"
            mkdir -p "$STAGE/$(dirname "$path")"
            cp -a "$path" "$STAGE/$path"
          }

          copy_file .env.example
          copy_file packages/config/src/env.ts
          copy_file services/api/.env.example
          copy_file services/api/Dockerfile
          copy_file services/api/src/index.ts
          mkdir -p "$STAGE/services/api/src/modules"
          cp -a services/api/src/modules/camp-feed "$STAGE/services/api/src/modules/camp-feed"

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS -print | sort | xargs sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          tar -C "$STAGE" -czf /tmp/camp-api-delivery/camp-api-release.tgz .
          tar -tzf /tmp/camp-api-delivery/camp-api-release.tgz | tee /tmp/camp-api-delivery/camp-api-release.files
          sha256sum /tmp/camp-api-delivery/camp-api-release.tgz | tee /tmp/camp-api-delivery/camp-api-release.tgz.sha256
          {
            echo "### Camp API release artifact"
            echo "- source_sha: ${RELEASE_SOURCE_SHA}"
            echo "- artifact: camp-api-release.tgz"
            echo "- sha256:"
            cat /tmp/camp-api-delivery/camp-api-release.tgz.sha256
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Docker build API preflight
        timeout-minutes: 35
        run: |
          set -euo pipefail
          docker build --progress=plain \
            -f services/api/Dockerfile \
            --build-arg NPM_CONFIG_REGISTRY="${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}" \
            --build-arg PRISMA_ENGINES_MIRROR="${PRISMA_ENGINES_MIRROR:-}" \
            -t "mywave-camp-api-preflight:${GITHUB_SHA}" \
            .

      - name: Upload selected release artifact
        uses: actions/upload-artifact@v4
        with:
          name: camp-api-release.tgz
          path: /tmp/camp-api-delivery/camp-api-release.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Create remote deploy script
        if: ${{ inputs.deploy_to_vps }}
        run: |
          set -euo pipefail
          cat >/tmp/camp-api-delivery/deploy-camp-api-remote.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${ROTATE_CAMP_TOKEN:?ROTATE_CAMP_TOKEN is required}"
          : "${BUILD_MODE:?BUILD_MODE is required}"
          : "${OPERATION:?OPERATION is required}"

          cd "$DEPLOY_PATH"
          export DC='docker compose --env-file .env.production -f docker-compose.production.yml'

          echo ">>> deploy path: $(pwd)"
          test -f docker-compose.production.yml

          CAMP_API_CURL_CONFIG=""
          cleanup_camp_api_auth() {
            if [ -n "$CAMP_API_CURL_CONFIG" ]; then
              rm -f "$CAMP_API_CURL_CONFIG"
            fi
          }
          trap cleanup_camp_api_auth EXIT

          prepare_camp_api_auth() {
            local camp_api_token="$1"
            cleanup_camp_api_auth
            CAMP_API_CURL_CONFIG="$(mktemp /tmp/camp-api-curl.XXXXXX)"
            chmod 600 "$CAMP_API_CURL_CONFIG"
            printf 'header = "Authorization: Bearer %s"\n' "$camp_api_token" > "$CAMP_API_CURL_CONFIG"
          }

          assert_single_api_dns() {
            local api_container proxy_container canonical_api_ip dns_api_ips
            api_container="$($DC ps -q api)"
            proxy_container="$($DC ps -q reverse-proxy)"
            test -n "$api_container"
            test -n "$proxy_container"

            canonical_api_ip="$(docker inspect "$api_container" --format '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' | head -n1)"
            dns_api_ips="$(
              docker exec "$proxy_container" sh -lc '
                i=0
                while [ "$i" -lt 20 ]; do
                  getent hosts api
                  i=$((i + 1))
                done
              ' | awk '{print $1}' | sort -u
            )"

            if [ "$dns_api_ips" != "$canonical_api_ip" ]; then
              echo ">>> ERROR: Docker DNS alias api is ambiguous"
              echo ">>> canonical api IP: $canonical_api_ip"
              echo ">>> resolved api IPs:"
              printf '%s\n' "$dns_api_ips"
              return 1
            fi
            echo ">>> Docker DNS api: $canonical_api_ip (single canonical endpoint)"
          }

          assert_camp_api_contract() {
            local query='status=published&sports=wakesurf,wakeboard&audience=ru&offset=0'
            local camp_id detail_status

            test -s "$CAMP_API_CURL_CONFIG"

            curl -kfsS --resolve api.mywavetour.ru:443:127.0.0.1 \
              --config "$CAMP_API_CURL_CONFIG" \
              "https://api.mywavetour.ru/api/v1/camps?${query}&limit=5&smoke=$(date +%s%N)" \
              -o /tmp/camp-api-smoke-limit5.json
            curl -kfsS --resolve api.mywavetour.ru:443:127.0.0.1 \
              --config "$CAMP_API_CURL_CONFIG" \
              "https://api.mywavetour.ru/api/v1/camps?${query}&limit=100&smoke=$(date +%s%N)" \
              -o /tmp/camp-api-smoke-limit100.json
            curl -kfsS --resolve api.mywavetour.ru:443:127.0.0.1 \
              --config "$CAMP_API_CURL_CONFIG" \
              "https://api.mywavetour.ru/api/v1/camps?${query}&smoke=$(date +%s%N)" \
              -o /tmp/camp-api-smoke-default.json

            python3 - <<'PY'
          import json

          five = json.load(open("/tmp/camp-api-smoke-limit5.json", encoding="utf-8"))
          hundred = json.load(open("/tmp/camp-api-smoke-limit100.json", encoding="utf-8"))
          default = json.load(open("/tmp/camp-api-smoke-default.json", encoding="utf-8"))
          five_items = five.get("items") or []
          hundred_items = hundred.get("items") or []
          default_items = default.get("items") or []
          ids = [item.get("id") for item in hundred_items]

          assert hundred_items, hundred
          assert [item.get("id") for item in default_items] == ids, {
              "default": len(default_items),
              "limit100": len(hundred_items),
          }
          assert len(five_items) == min(5, len(hundred_items)), {
              "limit5": len(five_items),
              "limit100": len(hundred_items),
          }
          assert [item.get("id") for item in five_items] == ids[:5]
          assert all(isinstance(camp_id, str) and camp_id for camp_id in ids), ids
          assert len(ids) == len(set(ids)), ids

          with open("/tmp/camp-api-smoke.ids", "w", encoding="utf-8") as target:
              target.write("\n".join(ids) + "\n")
          print("camp_list_consistency: ok")
          print("records_returned:", len(hundred_items))
          PY

            while IFS= read -r camp_id; do
              detail_status="$(
                curl -ksS --resolve api.mywavetour.ru:443:127.0.0.1 \
                  --config "$CAMP_API_CURL_CONFIG" \
                  -o /tmp/camp-api-smoke-detail.json \
                  -w '%{http_code}' \
                  "https://api.mywavetour.ru/api/v1/camps/${camp_id}?smoke=$(date +%s%N)"
              )"
              test "$detail_status" = "200"
              CAMP_ID="$camp_id" python3 - <<'PY'
          import json
          import os

          expected = os.environ["CAMP_ID"]
          payload = json.load(open("/tmp/camp-api-smoke-detail.json", encoding="utf-8"))
          assert payload.get("id") == expected, {"expected": expected, "payload": payload}
          PY
            done < /tmp/camp-api-smoke.ids
            echo ">>> Camp API list/detail consistency: ok"
          }

          assert_single_api_dns

          if [ "$OPERATION" = "restart_proxy_only" ]; then
            echo ">>> restart only reverse-proxy"
            $DC restart reverse-proxy
            $DC ps api postgres reverse-proxy

            assert_single_api_dns

            echo ">>> verify published Camp API fixture through local nginx"
            CAMP_API_TOKEN="$(grep '^CAMP_API_TOKEN=' services/api/.env.production | tail -n1 | cut -d= -f2- | tr -d '\"')"
            test -n "$CAMP_API_TOKEN"
            prepare_camp_api_auth "$CAMP_API_TOKEN"
            curl -kfsS --resolve api.mywavetour.ru:443:127.0.0.1 \
              --config "$CAMP_API_CURL_CONFIG" \
              "https://api.mywavetour.ru/api/v1/camps?status=published&sports=wakesurf,wakeboard&audience=ru&limit=100&offset=0&restart_probe=$(date +%s)" \
              -o /tmp/camp-api-restart-proxy-smoke.json

            python3 - <<'PY'
          import json

          camp_id = "tour_camp_api_mvp_wakesurf_v1"
          payload = json.load(open("/tmp/camp-api-restart-proxy-smoke.json", encoding="utf-8"))
          items = payload.get("items") or []
          camp = next((item for item in items if item.get("id") == camp_id), None)
          assert camp is not None, {"camp_id": camp_id, "ids": [item.get("id") for item in items]}
          assert camp.get("publication_status") == "published", camp
          assert camp.get("content_rights_status") == "unknown", camp
          print("restart_proxy_smoke: ok")
          print("records_returned:", len(items))
          print("camp_id:", camp_id)
          PY
            assert_camp_api_contract
            exit 0
          fi

          DEPLOY_STAMP="$(date +%Y%m%d%H%M%S)"
          BACKUP_PATH="/tmp/camp-api-selected-backup-${DEPLOY_STAMP}.tgz"
          ENV_BACKUP_PATH="/tmp/camp-api-env-backup-${DEPLOY_STAMP}"
          TOKEN_BACKUP_PATH="/tmp/camp-api-token-backup-${DEPLOY_STAMP}"
          ROLLBACK_IMAGE_TAG="mywave-camp-api-rollback:${DEPLOY_STAMP}"
          ROLLBACK_TOKEN_EXISTED=0

          tar -czf "$BACKUP_PATH" --ignore-failed-read \
            .env.example \
            packages/config/src/env.ts \
            services/api/.env.example \
            services/api/Dockerfile \
            services/api/src/index.ts \
            services/api/src/modules/camp-feed
          cp -a services/api/.env.production "$ENV_BACKUP_PATH"
          if [ -f /root/CAMP_API_TOKEN.current ]; then
            cp -a /root/CAMP_API_TOKEN.current "$TOKEN_BACKUP_PATH"
            ROLLBACK_TOKEN_EXISTED=1
          fi

          PREVIOUS_API_CONTAINER="$($DC ps -q api)"
          test -n "$PREVIOUS_API_CONTAINER"
          PREVIOUS_API_IMAGE_ID="$(docker inspect "$PREVIOUS_API_CONTAINER" --format '{{.Image}}')"
          PREVIOUS_API_IMAGE_NAME="$(docker inspect "$PREVIOUS_API_CONTAINER" --format '{{.Config.Image}}')"
          docker tag "$PREVIOUS_API_IMAGE_ID" "$ROLLBACK_IMAGE_TAG"
          echo ">>> selected source backup: $BACKUP_PATH"
          echo ">>> rollback image: $ROLLBACK_IMAGE_TAG"

          echo ">>> verify selected Camp/API/config artifact"
          VERIFY_DIR="/tmp/camp-api-release-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          tar -xzf /tmp/camp-api-release.tgz -C "$VERIFY_DIR"
          (cd "$VERIFY_DIR" && sha256sum -c SHA256SUMS)

          rollback_camp_api_deploy() {
            local original_rc="$1"
            trap - ERR
            set +e
            echo ">>> deployment failed; restoring Camp API snapshot"
            rm -rf services/api/src/modules/camp-feed
            tar -xzf "$BACKUP_PATH" -C "$DEPLOY_PATH"
            cp -a "$ENV_BACKUP_PATH" services/api/.env.production
            if [ "$ROLLBACK_TOKEN_EXISTED" = "1" ]; then
              cp -a "$TOKEN_BACKUP_PATH" /root/CAMP_API_TOKEN.current
            else
              rm -f /root/CAMP_API_TOKEN.current
            fi
            docker tag "$ROLLBACK_IMAGE_TAG" "$PREVIOUS_API_IMAGE_NAME"
            $DC up -d --no-deps --no-build --force-recreate api
            $DC restart reverse-proxy
            $DC ps api postgres reverse-proxy
            echo ">>> rollback completed; original exit code: $original_rc"
            exit "$original_rc"
          }
          trap 'rollback_camp_api_deploy $?' ERR

          echo ">>> extract selected Camp/API/config files"
          tar -xzf /tmp/camp-api-release.tgz -C "$DEPLOY_PATH" --exclude=SHA256SUMS

          echo ">>> verify Camp API source on host"
          test -f services/api/Dockerfile
          grep -R 'pnpm --filter @mywave/shared-types build' -n services/api/Dockerfile
          grep -R 'pnpm --filter @mywave/explore-links build' -n services/api/Dockerfile
          test -f services/api/src/modules/camp-feed/routes.ts
          grep -R 'router.get("/api/v1/camps"' -n services/api/src/modules/camp-feed/routes.ts
          grep -R 'router.get("/api/v1/camps/:id"' -n services/api/src/modules/camp-feed/routes.ts
          grep -R 'router.get("/camps-feed.json"' -n services/api/src/modules/camp-feed/routes.ts
          grep -R 'campFeedRoutes' -n services/api/src/index.ts
          grep -R 'CAMP_API_TOKEN' -n packages/config/src/env.ts
          grep -R 'next_offset' -n services/api/src/modules/camp-feed/routes.ts

          if [ "$ROTATE_CAMP_TOKEN" = "true" ]; then
            echo ">>> rotate CAMP_API_TOKEN on VPS"
            umask 077
            cp -a services/api/.env.production "services/api/.env.production.bak.$(date +%Y%m%d%H%M%S)"
            NEW_CAMP_API_TOKEN="$(openssl rand -hex 32)"
            if grep -q '^CAMP_API_TOKEN=' services/api/.env.production; then
              sed -i "s|^CAMP_API_TOKEN=.*|CAMP_API_TOKEN=${NEW_CAMP_API_TOKEN}|" services/api/.env.production
            else
              printf '\nCAMP_API_TOKEN=%s\n' "$NEW_CAMP_API_TOKEN" >> services/api/.env.production
            fi
            printf '%s\n' "$NEW_CAMP_API_TOKEN" > /root/CAMP_API_TOKEN.current
            chmod 600 /root/CAMP_API_TOKEN.current
            unset NEW_CAMP_API_TOKEN
            echo ">>> CAMP_API_TOKEN rotated; value saved only on VPS"
          else
            echo ">>> CAMP_API_TOKEN rotation skipped"
            test -s /root/CAMP_API_TOKEN.current || grep '^CAMP_API_TOKEN=' services/api/.env.production | tail -n1 | cut -d= -f2- | tr -d '"' > /root/CAMP_API_TOKEN.current
            chmod 600 /root/CAMP_API_TOKEN.current
          fi

          echo ">>> build only api"
          if [ "$BUILD_MODE" = "full" ]; then
            docker compose --progress=plain --env-file .env.production -f docker-compose.production.yml build --no-cache api
          else
            docker compose --progress=plain --env-file .env.production -f docker-compose.production.yml build api
          fi

          echo ">>> restart API, then refresh reverse-proxy workers"
          $DC up -d --no-deps api
          $DC restart reverse-proxy
          $DC ps

          echo ">>> verify Camp API code inside api container"
          $DC exec -T api sh -lc 'grep -R "api/v1/camps\|camps-feed.json\|campFeedRoutes" -n /app/services/api/dist /app/services/api/src 2>/tmp/camp-api-grep.err >/tmp/camp-api-grep.out; cat /tmp/camp-api-grep.out | head -80; test -s /tmp/camp-api-grep.out'

          assert_single_api_dns

          echo ">>> smoke local nginx without exposing token"
          CAMP_API_TOKEN="$(cat /root/CAMP_API_TOKEN.current)"
          prepare_camp_api_auth "$CAMP_API_TOKEN"
          curl -kfsS --resolve api.mywavetour.ru:443:127.0.0.1 \
            --config "$CAMP_API_CURL_CONFIG" \
            "https://api.mywavetour.ru/api/v1/camps?status=published&sports=wakesurf,wakeboard&audience=ru&limit=1&offset=0" \
            -o /tmp/camp-api-smoke.json

          python3 - <<'PY'
          import json
          p = "/tmp/camp-api-smoke.json"
          d = json.load(open(p, encoding="utf-8"))
          assert isinstance(d, dict), type(d)
          assert "items" in d, d
          assert "next_offset" in d, d
          print("smoke_status: ok")
          print("smoke_items:", len(d.get("items") or []))
          print("smoke_next_offset:", d.get("next_offset"))
          PY
          assert_camp_api_contract

          echo ">>> write Site sample on VPS"
          CAMP_API_TOKEN="$(cat /root/CAMP_API_TOKEN.current)"
          curl -kfsS --resolve api.mywavetour.ru:443:127.0.0.1 \
            --config "$CAMP_API_CURL_CONFIG" \
            "https://api.mywavetour.ru/api/v1/camps?status=published&sports=wakesurf,wakeboard&audience=ru&limit=5&offset=0" \
            -o /tmp/mywave-camps-sample.json

          python3 - <<'PY'
          import json
          p = "/tmp/mywave-camps-sample.json"
          d = json.load(open(p, encoding="utf-8"))
          items = d.get("items") or []
          empty = lambda v: v is None or v == "" or v == []
          print("sample_file:", p)
          print("records_returned:", len(items))
          print("has_wake_camps:", bool(items))
          print("next_offset:", d.get("next_offset"))
          print("content_rights_unknown:", sum(1 for x in items if x.get("content_rights_status") == "unknown"))
          print("without_photo:", sum(1 for x in items if empty(x.get("cover_image_url"))))
          print("without_price:", sum(1 for x in items if empty(x.get("price_from"))))
          print("without_booking_url:", sum(1 for x in items if empty(x.get("booking_url"))))
          PY
          trap - ERR
          docker image rm "$ROLLBACK_IMAGE_TAG" >/dev/null 2>&1 || true
          echo ">>> Camp API deployment completed; rollback trap disarmed"
          REMOTE
          chmod +x /tmp/camp-api-delivery/deploy-camp-api-remote.sh

      - name: Upload selected artifact and run on VPS
        if: ${{ inputs.deploy_to_vps }}
        env:
          DEPLOY_HOST: ${{ secrets.TOUR_VPS_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TOUR_VPS_USER || secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.TOUR_VPS_PATH || secrets.DEPLOY_PATH }}
          DEPLOY_KEY_TOUR: ${{ secrets.TOUR_VPS_SSH_KEY }}
          DEPLOY_KEY_TOUR_ALT: ${{ secrets.DEPLOY_SSH_KEY_TOUR }}
          DEPLOY_KEY_OPENSSH: ${{ secrets.DEPLOY_OPENSSH_PRIVATE_KEY }}
          DEPLOY_KEY_LEGACY: ${{ secrets.DEPLOY_SSH_KEY }}
          ROTATE_CAMP_TOKEN: ${{ inputs.rotate_camp_token }}
          BUILD_MODE: ${{ inputs.build_mode }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          : "${DEPLOY_HOST:?TOUR_VPS_HOST or DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?TOUR_VPS_USER or DEPLOY_USER secret is required}"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          out = Path.home() / ".ssh" / "deploy_key_candidates"
          out.mkdir(mode=0o700, exist_ok=True)
          names = [
              "DEPLOY_KEY_TOUR",
              "DEPLOY_KEY_TOUR_ALT",
              "DEPLOY_KEY_OPENSSH",
              "DEPLOY_KEY_LEGACY",
          ]

          def variants(raw):
              value = (raw or "").strip().strip('"').strip("'")
              if not value:
                  return []

              values = [value, value.replace("\\r", "").replace("\\n", "\n")]
              compact = value.replace("\n", "").replace("\r", "").strip()
              if compact and "PRIVATE KEY" not in compact:
                  try:
                      decoded = base64.b64decode(compact, validate=True).decode()
                      values.append(decoded)
                  except Exception:
                      pass

              result = []
              for item in values:
                  item = item.replace("\r", "").strip()
                  if "PRIVATE KEY" not in item:
                      continue
                  if not item.endswith("\n"):
                      item += "\n"
                  if item not in result:
                      result.append(item)
              return result

          count = 0
          for name in names:
              for value in variants(os.environ.get(name, "")):
                  count += 1
                  path = out / f"deploy_key_{count}"
                  path.write_text(value)
                  path.chmod(0o600)

          if count == 0:
              raise SystemExit("No SSH private key candidates found in TOUR_VPS_SSH_KEY/DEPLOY_SSH_KEY_TOUR/DEPLOY_OPENSSH_PRIVATE_KEY/DEPLOY_SSH_KEY")
          PY
          DEPLOY_KEY_FILE=""
          for candidate in ~/.ssh/deploy_key_candidates/deploy_key_*; do
            if ssh-keygen -y -f "$candidate" > /dev/null 2>&1; then
              DEPLOY_KEY_FILE="$candidate"
              break
            fi
          done
          if [ -z "$DEPLOY_KEY_FILE" ]; then
            echo "No valid SSH private key found in configured GitHub secrets" >&2
            exit 255
          fi
          cp "$DEPLOY_KEY_FILE" ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          DP="${DEPLOY_PATH:-/opt/mywave/toutism}"
          DP="$(echo "$DP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SSH_LONG="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=45 -o ConnectionAttempts=1 -o ServerAliveInterval=20 -o ServerAliveCountMax=240 -o TCPKeepAlive=yes"

          echo ">>> prepare selected Camp API artifact payload"
          ARTIFACT_B64="$(base64 -w0 /tmp/camp-api-delivery/camp-api-release.tgz)"
          SCRIPT_B64="$(base64 -w0 /tmp/camp-api-delivery/deploy-camp-api-remote.sh)"

          echo ">>> run single-session remote Camp API delivery"
          ssh $SSH_LONG "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail; mkdir -p '${DP}'; test -f '${DP}/docker-compose.production.yml'; printf '%s' '${ARTIFACT_B64}' | base64 -d > /tmp/camp-api-release.tgz; printf '%s' '${SCRIPT_B64}' | base64 -d > /tmp/deploy-camp-api-remote.sh; chmod 700 /tmp/deploy-camp-api-remote.sh; DEPLOY_PATH='${DP}' ROTATE_CAMP_TOKEN='${ROTATE_CAMP_TOKEN}' BUILD_MODE='${BUILD_MODE}' OPERATION='${OPERATION}' bash /tmp/deploy-camp-api-remote.sh"
          unset ARTIFACT_B64 SCRIPT_B64
