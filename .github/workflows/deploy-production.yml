# Деплой на VPS только вручную (workflow_dispatch), пока не накопятся успешные прогоны и свежий DEPLOY_EVIDENCE.
# Ранее: push в main — отключено по управленческому решению (риск auto-deploy).
#
# Секреты (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_OPENSSH_PRIVATE_KEY
#   DEPLOY_PATH — опционально (по умолчанию /opt/mywave/tourism). На VPS в SSH используется `docker compose --env-file .env.production`, чтобы подхватывались в т.ч. `COMPOSE_PROJECT_NAME` и `NPM_CONFIG_REGISTRY`.
#
# Код копируется rsync с раннера GitHub на VPS (checkout уже с токеном для private repo).
# ВАЖНО: исключить infra/nginx/certs/ — PEM не в git; при --delete без exclude rsync УДАЛЯЕТ их на VPS → nginx не стартует → 443 connection refused.
# На VPS не вызывается api.github.com — обход SSL timeout с VPS до GitHub.
#
# На сервере: публичный ключ в ~/.ssh/authorized_keys. При перегрузке SSH — MaxStartups / PerSourceMaxStartups.
# Раннер GitHub (Azure) → VPS: возможны «banner exchange» или connect timeout на :22.
# Если часто connect timeout — файрвол/гео в панели Timeweb, либо self-hosted runner на этом VPS.
# Повторы ниже с коротким ConnectTimeout. При connect timeout — Re-run jobs (сеть Azure→Timeweb лотерея).
# Сборка docker — тем же OpenSSH, что и rsync (одно долгое соединение), без второго appleboy/drone-ssh.

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "sync_only — только rsync; web_only — пересборка web + reverse-proxy (без api/admin); full — полный стек"
        type: choice
        default: full
        options:
          - sync_only
          - web_only
          - full
      build_mode:
        description: "incremental — быстрый up --build (кэш слоёв); full — build --no-cache api/web/admin"
        type: choice
        default: incremental
        options:
          - incremental
          - full

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rsync codebase to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_OPENSSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          printenv DEPLOY_KEY | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo ">>> Проверка, что приватный ключ читается OpenSSH"
          ssh-keygen -lf ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DP="${DEPLOY_PATH:-/opt/mywave/tourism}"
          DP="$(echo "$DP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          # Короткий connect для быстрых probe-попыток
          SSH_PROBE="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=28 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=30"
          # Долгая передача rsync: keepalive иначе NAT/файрвол может рвать сессию через 10–20 мин → «висим» и exit 255
          SSH_RSYNC="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=60 -o ConnectionAttempts=1 -o ServerAliveInterval=20 -o ServerAliveCountMax=240 -o TCPKeepAlive=yes"
          echo ">>> SSH probe ${DEPLOY_USER}@${DEPLOY_HOST} (mkdir ${DP})"
          PROBE_OK=0
          for i in $(seq 1 28); do
            echo ">>> SSH probe attempt $i/28"
            if ssh $SSH_PROBE "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DP}' && echo ssh-ok"; then
              PROBE_OK=1
              break
            fi
            sleep 12
          done
          if [ "$PROBE_OK" != 1 ]; then
            echo ">>> SSH probe: все попытки исчерпаны (часто: файрвол Timeweb / блок Azure→VPS на :22)." >&2
            echo ">>> См. self-hosted runner: https://docs.github.com/en/actions/hosting-your-own-runners" >&2
            exit 255
          fi
          echo ">>> rsync -> ${DEPLOY_USER}@${DEPLOY_HOST}:${DP}/"
          RSYNC_OK=0
          for i in $(seq 1 10); do
            echo ">>> rsync attempt $i/10 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            if rsync -avz \
              --timeout=900 \
              -e "ssh $SSH_RSYNC" \
              --delete \
              --exclude='.git/' \
              --exclude='node_modules/' \
              --exclude='.next/' \
              --exclude='dist/' \
              --exclude='backups/' \
              --exclude='logs/' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='.cursor/' \
              --exclude='.turbo/' \
              --exclude='coverage/' \
              --exclude='**/.turbo/' \
              --exclude='**/test-results/' \
              --exclude='**/*.tsbuildinfo' \
              --exclude='infra/nginx/certs/' \
              "$GITHUB_WORKSPACE/" "${DEPLOY_USER}@${DEPLOY_HOST}:${DP}/"; then
              RSYNC_OK=1
              break
            fi
            echo ">>> rsync attempt $i failed (см. вывод выше); пауза перед повтором" >&2
            sleep 15
          done
          if [ "$RSYNC_OK" != 1 ]; then
            echo ">>> rsync: все попытки исчерпаны. Если probe был ssh-ok — часто обрыв канала/NAT, fail2ban на VPS, диск или файрвол Timeweb." >&2
            echo ">>> Док: docs/deployment/TIMEWEB_AND_ACTIONS_LINKS.md" >&2
            exit 255
          fi

      - name: Build and restart api, web, admin on VPS
        if: ${{ inputs.deploy_mode != 'sync_only' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_OPENSSH_PRIVATE_KEY }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          set -euo pipefail
          DEPLOY_MODE="${DEPLOY_MODE:-full}"
          BUILD_MODE="${BUILD_MODE:-incremental}"
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printenv DEPLOY_KEY | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DP="${DEPLOY_PATH:-/opt/mywave/tourism}"
          DP="$(echo "$DP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SSH_LONG="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=45 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=300"
          echo ">>> Один SSH-сессия: DEPLOY_MODE=${DEPLOY_MODE}, BUILD_MODE=${BUILD_MODE} (вывод идёт сюда)"
          if [ "$DEPLOY_MODE" = "web_only" ]; then
            ssh $SSH_LONG "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "set -euo pipefail; cd '${DP}'; \
               echo '>>> docker compose up -d --no-deps --build web reverse-proxy (код витрины в образе — нужен --build после rsync)'; \
               docker compose --env-file .env.production -f docker-compose.production.yml up -d --no-deps --build web reverse-proxy; \
               docker compose --env-file .env.production -f docker-compose.production.yml ps"
          elif [ "$BUILD_MODE" = "full" ]; then
            ssh $SSH_LONG "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "set -euo pipefail; cd '${DP}'; \
               echo '>>> docker compose build --no-cache api web admin'; \
               docker compose --env-file .env.production -f docker-compose.production.yml build --no-cache api web admin; \
               echo '>>> docker compose up -d api web admin reverse-proxy'; \
               docker compose --env-file .env.production -f docker-compose.production.yml up -d api web admin reverse-proxy; \
               docker compose --env-file .env.production -f docker-compose.production.yml ps"
          else
            ssh $SSH_LONG "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "set -euo pipefail; cd '${DP}'; \
               echo '>>> docker compose up -d --build api web admin reverse-proxy (incremental)'; \
               docker compose --env-file .env.production -f docker-compose.production.yml up -d --build api web admin reverse-proxy; \
               docker compose --env-file .env.production -f docker-compose.production.yml ps"
          fi
