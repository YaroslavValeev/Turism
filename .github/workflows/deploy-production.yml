# Деплой на VPS только вручную (workflow_dispatch), пока не накопятся успешные прогоны и свежий DEPLOY_EVIDENCE.
# Для Camp API используется отдельный job deploy-camp-api, который синхронизирует код и запускает только API/обратный прокси.

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "sync_only — только rsync; web_only — пересборка web + reverse-proxy (без api/admin); full — полный стек"
        type: choice
        default: full
        options:
          - sync_only
          - web_only
          - full
      build_mode:
        description: "incremental — быстрый up --build (кэш слоёв); full — build --no-cache api/web/admin"
        type: choice
        default: incremental
        options:
          - incremental
          - full

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release identity
        run: |
          set -euo pipefail
          mkdir -p .release
          printf '%s\n' "$GITHUB_SHA" > .release/REVISION
          printf '%s\n' "$GITHUB_RUN_ID" > .release/GITHUB_RUN_ID
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .release/BUILT_AT

      - name: Verify nginx config (syntax)
        run: |
          set -euo pipefail
          chmod +x scripts/verify_nginx_config.sh
          bash scripts/verify_nginx_config.sh

      - name: Rsync codebase to VPS
        env:
          DEPLOY_HOST: ${{ secrets.TOUR_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.TOUR_VPS_USER }}
          DEPLOY_PATH: ${{ secrets.TOUR_VPS_PATH }}
          DEPLOY_KEY: ${{ secrets.TOUR_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          printenv DEPLOY_KEY | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DP="${DEPLOY_PATH:-/opt/mywave/tourism}"
          DP="$(echo "$DP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          case "$DP" in
            ""|"/"|"/opt"|"/opt/"|"/opt/mywave"|"/opt/mywave/") echo "Unsafe DEPLOY_PATH: $DP" >&2; exit 64 ;;
          esac
          SSH_PROBE="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=28 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=30"
          SSH_RSYNC="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=60 -o ConnectionAttempts=1 -o ServerAliveInterval=20 -o ServerAliveCountMax=240 -o TCPKeepAlive=yes"
          PROBE_OK=0
          for i in $(seq 1 20); do
            if ssh $SSH_PROBE "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DP}' && echo ssh-ok"; then
              PROBE_OK=1
              break
            fi
            sleep 10
          done
          if [ "$PROBE_OK" != 1 ]; then
            echo "SSH probe failed" >&2
            exit 255
          fi
          ssh $SSH_PROBE "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail; DP='${DP}'; case \"\$DP\" in ''|'/'|'/opt'|'/opt/'|'/opt/mywave'|'/opt/mywave/') echo \"Unsafe DEPLOY_PATH: \$DP\" >&2; exit 64 ;; esac; install -m 700 -d /var/backups/mywave-tourism /var/lib/mywave-tourism; if [ -d \"\$DP\" ]; then BACKUP_PATH=\"/var/backups/mywave-tourism/release-\$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA}.tgz\"; tar --warning=no-file-changed --ignore-failed-read -czf \"\$BACKUP_PATH\" -C \"\$(dirname \"\$DP\")\" \"\$(basename \"\$DP\")\" --exclude='node_modules' --exclude='.next' --exclude='dist' --exclude='logs' --exclude='backups'; printf '%s\n' \"\$BACKUP_PATH\" > /var/lib/mywave-tourism/last-release-backup; echo \"release_backup=\$BACKUP_PATH\"; fi"
          if rsync -avz --timeout=900 -e "ssh $SSH_RSYNC" --delete --exclude='.git/' --exclude='node_modules/' --exclude='.next/' --exclude='dist/' --exclude='backups/' --exclude='logs/' --exclude='.env' --exclude='.env.*' --exclude='.cursor/' --exclude='.turbo/' --exclude='coverage/' --exclude='**/.turbo/' --exclude='**/test-results/' --exclude='**/*.tsbuildinfo' --exclude='infra/nginx/certs/' "$GITHUB_WORKSPACE/" "${DEPLOY_USER}@${DEPLOY_HOST}:${DP}/"; then
            echo "Rsync complete"
          else
            exit 255
          fi

      - name: Build and restart api, web, admin on VPS
        if: ${{ inputs.deploy_mode != 'sync_only' }}
        env:
          DEPLOY_HOST: ${{ secrets.TOUR_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.TOUR_VPS_USER }}
          DEPLOY_PATH: ${{ secrets.TOUR_VPS_PATH }}
          DEPLOY_KEY: ${{ secrets.TOUR_VPS_SSH_KEY }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          set -euo pipefail
          DEPLOY_MODE="${DEPLOY_MODE:-full}"
          BUILD_MODE="${BUILD_MODE:-incremental}"
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printenv DEPLOY_KEY | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DP="${DEPLOY_PATH:-/opt/mywave/tourism}"
          DP="$(echo "$DP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          case "$DP" in
            ""|"/"|"/opt"|"/opt/"|"/opt/mywave"|"/opt/mywave/") echo "Unsafe DEPLOY_PATH: $DP" >&2; exit 64 ;;
          esac
          SSH_LONG="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=45 -o ConnectionAttempts=1 -o ServerAliveInterval=20 -o ServerAliveCountMax=300"
          ssh $SSH_LONG "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_PATH='${DP}' DEPLOY_MODE='${DEPLOY_MODE}' BUILD_MODE='${BUILD_MODE}' EXPECTED_SHA='${GITHUB_SHA}' RELEASE_BUILT_AT='$(cat .release/BUILT_AT)' GITHUB_RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          DC=(docker compose --env-file .env.production -f docker-compose.production.yml)
          if [ "$(cat .release/REVISION)" != "$EXPECTED_SHA" ]; then
            echo "Release SHA mismatch on VPS" >&2
            exit 65
          fi
          if [ "$DEPLOY_MODE" = "web_only" ]; then
            "${DC[@]}" up -d --no-deps --build web reverse-proxy
          elif [ "$BUILD_MODE" = "full" ]; then
            "${DC[@]}" build --no-cache api web admin
            "${DC[@]}" run --rm api sh -lc 'cd /app/services/api && pnpm exec prisma migrate deploy'
            "${DC[@]}" up -d api web admin reverse-proxy
          else
            "${DC[@]}" build api web admin
            "${DC[@]}" run --rm api sh -lc 'cd /app/services/api && pnpm exec prisma migrate deploy'
            "${DC[@]}" up -d api web admin reverse-proxy
          fi
          "${DC[@]}" ps
          PROD_HEALTHCHECK_EXPECTED_SHA="$EXPECTED_SHA" MYWAVE_ROOT="$DEPLOY_PATH" bash scripts/prod_healthcheck.sh
          echo "release_sha=$EXPECTED_SHA"
          echo "rollback_backup=$(cat /var/lib/mywave-tourism/last-release-backup 2>/dev/null || true)"
          REMOTE
