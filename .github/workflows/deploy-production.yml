# Деплой на VPS после push в main (и вручную из Actions).
#
# Секреты (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_OPENSSH_PRIVATE_KEY
#   DEPLOY_PATH — опционально (по умолчанию /opt/mywave/toutism). Проверьте орфографию: toutism, не tourism.
#
# Код копируется rsync с раннера GitHub на VPS (checkout уже с токеном для private repo).
# На VPS не вызывается api.github.com — обход SSL timeout с VPS до GitHub.
#
# На сервере: публичный ключ в ~/.ssh/authorized_keys. При перегрузке SSH — MaxStartups / PerSourceMaxStartups.

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rsync codebase to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_OPENSSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printenv DEPLOY_KEY | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DP="${DEPLOY_PATH:-/opt/mywave/toutism}"
          SSH_OPTS="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=90 -o ServerAliveInterval=15 -o ServerAliveCountMax=12"
          echo ">>> SSH probe ${DEPLOY_USER}@${DEPLOY_HOST} (mkdir ${DP})"
          ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DP}' && echo ssh-ok"
          echo ">>> rsync -> ${DEPLOY_USER}@${DEPLOY_HOST}:${DP}/"
          rsync -avz -e "ssh $SSH_OPTS" \
            --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='dist/' \
            --exclude='backups/' \
            --exclude='logs/' \
            --exclude='.env' \
            --exclude='.env.*' \
            "$GITHUB_WORKSPACE/" "${DEPLOY_USER}@${DEPLOY_HOST}:${DP}/"

      - name: Build and restart web on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_OPENSSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/mywave/toutism}"
            cd "$DEPLOY_PATH"
            echo ">>> docker compose build + up"
            docker compose -f docker-compose.production.yml build --no-cache web
            docker compose -f docker-compose.production.yml up -d web
            docker compose -f docker-compose.production.yml ps
