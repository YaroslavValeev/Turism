# Деплой на VPS после push в main (и вручную из Actions).
#
# Секреты (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_OPENSSH_PRIVATE_KEY
#   DEPLOY_PATH — опционально (по умолчанию /opt/mywave/toutism). Проверьте орфографию: toutism, не tourism.
#
# Код копируется rsync с раннера GitHub на VPS (checkout уже с токеном для private repo).
# На VPS не вызывается api.github.com — обход SSL timeout с VPS до GitHub.
#
# На сервере: публичный ключ в ~/.ssh/authorized_keys. При перегрузке SSH — MaxStartups / PerSourceMaxStartups.
# Раннер GitHub (Azure) → VPS: возможны «banner exchange» или connect timeout на :22.
# Если часто connect timeout — файрвол/гео в панели Timeweb, либо self-hosted runner на этом VPS.
# Повторы ниже с коротким ConnectTimeout. При connect timeout — Re-run jobs (сеть Azure→Timeweb лотерея).

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rsync codebase to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_OPENSSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          printenv DEPLOY_KEY | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo ">>> Проверка, что приватный ключ читается OpenSSH"
          ssh-keygen -lf ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DP="${DEPLOY_PATH:-/opt/mywave/toutism}"
          DP="$(echo "$DP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SSH_OPTS="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=28 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=30"
          echo ">>> SSH probe ${DEPLOY_USER}@${DEPLOY_HOST} (mkdir ${DP})"
          PROBE_OK=0
          for i in $(seq 1 20); do
            echo ">>> SSH probe attempt $i/20"
            if ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DP}' && echo ssh-ok"; then
              PROBE_OK=1
              break
            fi
            sleep 15
          done
          if [ "$PROBE_OK" != 1 ]; then
            echo ">>> SSH probe: все попытки исчерпаны (часто: файрвол Timeweb / блок Azure→VPS на :22)." >&2
            echo ">>> См. self-hosted runner: https://docs.github.com/en/actions/hosting-your-own-runners" >&2
            exit 255
          fi
          echo ">>> rsync -> ${DEPLOY_USER}@${DEPLOY_HOST}:${DP}/"
          RSYNC_OK=0
          for i in $(seq 1 10); do
            echo ">>> rsync attempt $i/10"
            if rsync -avz -e "ssh $SSH_OPTS" \
              --delete \
              --exclude='.git/' \
              --exclude='node_modules/' \
              --exclude='.next/' \
              --exclude='dist/' \
              --exclude='backups/' \
              --exclude='logs/' \
              --exclude='.env' \
              --exclude='.env.*' \
              "$GITHUB_WORKSPACE/" "${DEPLOY_USER}@${DEPLOY_HOST}:${DP}/"; then
              RSYNC_OK=1
              break
            fi
            sleep 15
          done
          if [ "$RSYNC_OK" != 1 ]; then
            echo ">>> rsync: все попытки исчерпаны (сеть до VPS или SSH)." >&2
            exit 255
          fi

      - name: Build and restart api, web, admin on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_OPENSSH_PRIVATE_KEY }}
          port: 22
          protocol: tcp4
          timeout: 15m
          command_timeout: 90m
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/mywave/toutism}"
            cd "$DEPLOY_PATH"
            echo ">>> docker compose build --no-cache api web admin"
            docker compose -f docker-compose.production.yml build --no-cache api web admin
            echo ">>> docker compose up -d api web admin reverse-proxy"
            docker compose -f docker-compose.production.yml up -d api web admin reverse-proxy
            docker compose -f docker-compose.production.yml ps
