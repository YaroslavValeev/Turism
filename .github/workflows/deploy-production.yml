# Деплой на VPS только вручную (workflow_dispatch), пока не накопятся успешные прогоны и свежий DEPLOY_EVIDENCE.
# Для Camp API используется отдельный job deploy-camp-api, который синхронизирует код и запускает только API/обратный прокси.

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "sync_only — только rsync; web_only — пересборка web + reverse-proxy (без api/admin); full — полный стек"
        type: choice
        default: full
        options:
          - sync_only
          - web_only
          - full
      build_mode:
        description: "incremental — быстрый up --build (кэш слоёв); full — build --no-cache api/web/admin"
        type: choice
        default: incremental
        options:
          - incremental
          - full

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify nginx config (syntax)
        run: |
          set -euo pipefail
          chmod +x scripts/verify_nginx_config.sh
          bash scripts/verify_nginx_config.sh

      - name: Rsync codebase to VPS
        env:
          DEPLOY_HOST: ${{ secrets.TOUR_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.TOUR_VPS_USER }}
          DEPLOY_PATH: ${{ secrets.TOUR_VPS_PATH }}
          DEPLOY_KEY: ${{ secrets.TOUR_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          printenv DEPLOY_KEY | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DP="${DEPLOY_PATH:-/opt/mywave/tourism}"
          DP="$(echo "$DP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SSH_PROBE="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=28 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=30"
          SSH_RSYNC="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=60 -o ConnectionAttempts=1 -o ServerAliveInterval=20 -o ServerAliveCountMax=240 -o TCPKeepAlive=yes"
          PROBE_OK=0
          for i in $(seq 1 20); do
            if ssh $SSH_PROBE "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DP}' && echo ssh-ok"; then
              PROBE_OK=1
              break
            fi
            sleep 10
          done
          if [ "$PROBE_OK" != 1 ]; then
            echo "SSH probe failed" >&2
            exit 255
          fi
          if rsync -avz --timeout=900 -e "ssh $SSH_RSYNC" --delete --exclude='.git/' --exclude='node_modules/' --exclude='.next/' --exclude='dist/' --exclude='backups/' --exclude='logs/' --exclude='.env' --exclude='.env.*' --exclude='.cursor/' --exclude='.turbo/' --exclude='coverage/' --exclude='**/.turbo/' --exclude='**/test-results/' --exclude='**/*.tsbuildinfo' --exclude='infra/nginx/certs/' "$GITHUB_WORKSPACE/" "${DEPLOY_USER}@${DEPLOY_HOST}:${DP}/"; then
            echo "Rsync complete"
          else
            exit 255
          fi

      - name: Build and restart api, web, admin on VPS
        if: ${{ inputs.deploy_mode != 'sync_only' }}
        env:
          DEPLOY_HOST: ${{ secrets.TOUR_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.TOUR_VPS_USER }}
          DEPLOY_PATH: ${{ secrets.TOUR_VPS_PATH }}
          DEPLOY_KEY: ${{ secrets.TOUR_VPS_SSH_KEY }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          set -euo pipefail
          DEPLOY_MODE="${DEPLOY_MODE:-full}"
          BUILD_MODE="${BUILD_MODE:-incremental}"
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          install -m 700 -d ~/.ssh
          printenv DEPLOY_KEY | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DP="${DEPLOY_PATH:-/opt/mywave/tourism}"
          DP="$(echo "$DP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SSH_LONG="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=45 -o ConnectionAttempts=1 -o ServerAliveInterval=20 -o ServerAliveCountMax=300"
          if [ "$DEPLOY_MODE" = "web_only" ]; then
            ssh $SSH_LONG "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail; cd '${DP}'; docker compose --env-file .env.production -f docker-compose.production.yml up -d --no-deps --build web reverse-proxy; docker compose --env-file .env.production -f docker-compose.production.yml ps"
          elif [ "$BUILD_MODE" = "full" ]; then
            ssh $SSH_LONG "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail; cd '${DP}'; docker compose --env-file .env.production -f docker-compose.production.yml build --no-cache api web admin; docker compose --env-file .env.production -f docker-compose.production.yml up -d api web admin reverse-proxy; docker compose --env-file .env.production -f docker-compose.production.yml ps"
          else
            ssh $SSH_LONG "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail; cd '${DP}'; docker compose --env-file .env.production -f docker-compose.production.yml up -d --build api web admin reverse-proxy; docker compose --env-file .env.production -f docker-compose.production.yml ps"
          fi

  deploy-camp-api:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Camp API files to VPS
        env:
          DEPLOY_HOST: ${{ secrets.TOUR_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.TOUR_VPS_USER }}
          DEPLOY_PATH: ${{ secrets.TOUR_VPS_PATH }}
          DEPLOY_KEY: ${{ secrets.TOUR_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          printenv DEPLOY_KEY | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DP="${DEPLOY_PATH:-/opt/mywave/tourism}"
          DP="$(echo "$DP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SSH="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=45 -o ConnectionAttempts=1"
          ssh $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DP}'"
          rsync -avz --timeout=900 -e "ssh $SSH" \
            --include='services/api/src/modules/camp-feed/' \
            --include='services/api/src/modules/camp-feed/**' \
            --include='services/api/src/index.ts' \
            --include='packages/config/src/env.ts' \
            --include='services/api/.env.example' \
            --include='.env.example' \
            --include='services/api/src/routes/' \
            --include='services/api/src/routes/**' \
            --include='services/api/src/middleware/' \
            --include='services/api/src/middleware/**' \
            --exclude='*' \
            "$GITHUB_WORKSPACE/" "${DEPLOY_USER}@${DEPLOY_HOST}:${DP}/"

      - name: Verify Camp API files on VPS
        env:
          DEPLOY_HOST: ${{ secrets.TOUR_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.TOUR_VPS_USER }}
          DEPLOY_PATH: ${{ secrets.TOUR_VPS_PATH }}
          DEPLOY_KEY: ${{ secrets.TOUR_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          printenv DEPLOY_KEY | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DP="${DEPLOY_PATH:-/opt/mywave/tourism}"
          DP="$(echo "$DP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SSH="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=45 -o ConnectionAttempts=1"
          ssh $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail; cd '${DP}'; echo '--- verify ---'; grep -RIn 'camp-feed\|api/v1/camps\|camps-feed.json\|INVALID_CAMP_API_TOKEN\|CAMP_API_TOKEN' services/api/src packages/config/src services/api/.env.example .env.example || true"

      - name: Rebuild and restart API on VPS
        env:
          DEPLOY_HOST: ${{ secrets.TOUR_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.TOUR_VPS_USER }}
          DEPLOY_PATH: ${{ secrets.TOUR_VPS_PATH }}
          DEPLOY_KEY: ${{ secrets.TOUR_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          printenv DEPLOY_KEY | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DP="${DEPLOY_PATH:-/opt/mywave/tourism}"
          DP="$(echo "$DP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SSH="-4 -i ${HOME}/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=45 -o ConnectionAttempts=1"
          ssh $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail; cd '${DP}'; docker compose --env-file .env.production -f docker-compose.production.yml build --progress=plain api; docker compose --env-file .env.production -f docker-compose.production.yml up -d api reverse-proxy"
