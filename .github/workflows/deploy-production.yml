# Деплой на VPS по SSH после push в main (и вручную из вкладки Actions).
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST          — IPv4 VPS, например 5.129.249.113
#   DEPLOY_USER          — обычно root
#   DEPLOY_OPENSSH_PRIVATE_KEY — приватный ключ OpenSSH (полностью, BEGIN…END)
#   (устаревшее имя DEPLOY_SSH_KEY больше не используется workflow)
#   (порт SSH — 22; другой порт — правьте шаг ниже, в with.port)
#   DEPLOY_PATH          — опционально; если не задан — /opt/mywave/toutism на сервере
#
# На сервере: публичный ключ из пары в ~/.ssh/authorized_keys для DEPLOY_USER.
# Файлы .env* на сервере не перезаписываются (rsync --exclude).
#
# Private repo: скачивание на VPS идёт через GitHub API с github.token (env GH_ARCHIVE_TOKEN).
# Если SSH с GitHub к VPS всё ещё упирается в MaxStartups — поднимите лимиты / fail2ban
# или поставьте self-hosted runner на этот же VPS (тогда SSH снаружи не нужен).

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Для private-репо архив по публичному URL не качается — нужен API + токен.
          GH_ARCHIVE_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_OPENSSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 45m
          envs: GH_ARCHIVE_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/mywave/toutism}"
            REPO="${{ github.repository }}"
            TMP="$(mktemp -d)"
            trap 'rm -rf "$TMP"' EXIT
            cd "$TMP"
            echo ">>> Download tarball via GitHub API (private repo)"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_ARCHIVE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -L "https://api.github.com/repos/${REPO}/tarball/main" \
              -o src.tgz
            mkdir -p unpack
            tar -xzf src.tgz -C unpack
            SRC="$(find unpack -mindepth 1 -maxdepth 1 -type d | head -1)"
            if [ ! -d "$SRC" ]; then
              echo "Expected source dir not found under unpack/" >&2
              ls -la unpack >&2
              exit 1
            fi
            mkdir -p "$DEPLOY_PATH"
            echo ">>> rsync -> $DEPLOY_PATH"
            rsync -a --delete \
              --exclude '.git/' \
              --exclude 'node_modules/' \
              --exclude '**/.next/' \
              --exclude '**/dist/' \
              --exclude 'backups/' \
              --exclude 'logs/' \
              --exclude '.env' \
              --exclude '.env.*' \
              --exclude '**/.env' \
              --exclude '**/.env.*' \
              "$SRC/" "$DEPLOY_PATH/"
            cd "$DEPLOY_PATH"
            echo ">>> docker compose build + up"
            docker compose -f docker-compose.production.yml build --no-cache web
            docker compose -f docker-compose.production.yml up -d web
            docker compose -f docker-compose.production.yml ps
