services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      # Сборка на VPS: host-сеть часто стабильнее для npm registry, чем bridge.
      network: host
    restart: unless-stopped
    env_file:
      - .env.production
      - services/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ingestion_media:/app/apps/web/public/ingestion-media
      - ./logs/api:/var/log/mywave/api
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3001/health',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200&&d.includes('ok')?0:1))}).on('error',()=>process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
      - apps/web/.env.production
    depends_on:
      - api
    expose:
      - "3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
      - apps/admin/.env.production
    depends_on:
      - api
    expose:
      - "3002"

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - admin
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/mywave.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./infra/certbot-webroot:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx

volumes:
  postgres_data:
  ingestion_media:
